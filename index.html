<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钉子这顿吃什么</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Serif SC', serif;
            overflow: hidden;
            background-color: #f3f4f6;
            transition: background-color 1.5s ease;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-long {
            width: 240px;
            height: 50px;
            background: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-long:hover {
            transform: scale(1.05);
            background: #000;
        }

        .rain {
            position: absolute;
            width: 1px;
            height: 50px;
            background: rgba(255,255,255,0.3);
            top: -50px;
        }

        .option-btn {
            text-align: left;
            padding: 12px 20px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            transition: all 0.2s;
            background: rgba(255,255,255,0.5);
        }

        .option-btn:active {
            background: #333;
            color: white;
        }

        .fade-enter-active, .fade-leave-active { transition: opacity 0.5s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
    </style>
</head>
<body>

<div id="app" :style="{ backgroundColor: currentBgColor }" class="h-screen w-full flex items-center justify-center relative px-6">
    
    <!-- 动态天气背景 -->
    <div v-if="step === 0" class="absolute inset-0 overflow-hidden pointer-events-none">
        <div v-for="n in 20" :key="n" class="rain" :style="rainStyle(n)"></div>
    </div>

    <!-- 1. 首页 -->
    <transition name="fade">
        <div v-if="step === 0" class="text-center z-10">
            <h1 class="text-4xl font-bold mb-4 tracking-widest text-gray-800">钉子今天吃什么 🥗</h1>
            <p class="text-gray-500 mb-12 tracking-widest">这是一个值得深思的问题 ￼</p>
            <div class="flex justify-center">
                <div @click="nextStep" class="btn-long shadow-lg">开始探索</div>
            </div>
        </div>
    </transition>

    <!-- 2. 问题页 -->
    <transition name="fade">
        <div v-if="step > 0 && step <= totalQuestions" class="w-full max-w-md">
            <div class="mb-8">
                <span class="text-xs uppercase tracking-widest text-gray-400 block mb-1">Question {{step}} / 10</span>
                <h2 class="text-xl font-bold text-gray-800 mb-2 leading-relaxed">
                    {{ questions[step-1].title }}
                </h2>
                <p class="text-sm text-gray-500 animate__animated animate__fadeInUp">
                    {{ questions[step-1].desc }}
                </p>
            </div>

            <div class="flex flex-col">
                <button 
                    v-for="(opt, idx) in questions[step-1].options" 
                    :key="idx"
                    @click="handleAnswer(idx)"
                    class="option-btn animate__animated animate__fadeInUp"
                    :style="{ animationDelay: (idx * 0.1) + 's' }"
                >
                    <span class="font-mono mr-2">{{ String.fromCharCode(65 + idx) }}.</span> {{ opt }}
                </button>
            </div>
        </div>
    </transition>

    <!-- 3. 结果页 (彩蛋设计) -->
    <transition name="fade">
        <div v-if="step > totalQuestions" class="text-center w-full max-w-sm">
            <div class="glass-card p-8 shadow-2xl relative overflow-hidden animate__animated animate__zoomIn">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-yellow-400 via-red-400 to-pink-500"></div>
                <div class="text-sm text-gray-400 mb-2">— 钉子的今日惊喜 —</div>
                <h2 class="text-3xl font-bold text-gray-800 mb-4">{{ finalFood.name }}</h2>
                <div class="bg-gray-100 rounded-lg p-4 mb-4 text-left">
                    <p class="text-xs text-gray-400 mb-1">能量系数：{{ finalFood.kcal }}</p>
                    <p class="text-xs text-gray-400 mb-2">配料：{{ finalFood.ingredients }}</p>
                    <p class="text-sm leading-relaxed text-gray-600 border-t pt-2 border-gray-200">
                        {{ finalFood.story }}
                    </p>
                </div>
                <button @click="reset" class="text-xs text-gray-400 underline mt-4">不满意？再选一次</button>
            </div>
        </div>
    </transition>
</div>

<script>
const { createApp, ref, computed } = Vue;

createApp({
    setup() {
        const step = ref(0);
        const answers = ref([]);
        const totalQuestions = 10;

        const colors = [
            '#e5e7eb', // 首页
            '#dcfce7', // 1 逛公园
            '#e0f2fe', // 2 冬天冷
            '#fef9c3', // 3 睡午觉
            '#ffedd5', // 4 龙子湖
            '#ecfdf5', // 5 西湖骑行
            '#f3f4f6', // 6 雕塑园
            '#ede9fe', // 7 高原
            '#fee2e2', // 8 摩托
            '#fff7ed', // 9 雪山
            '#f5f5f5'  // 10 歌词
        ];

        const questions = [
            { title: "这绝对是个逛公园的好天气", desc: "昨晚大暴雨，现在凉快了。钉子站在阳台。", options: ["干点正经事儿", "出门遛遛", "今天不想动", "再墨迹一会儿"] },
            { title: "夏天会好一点吧", desc: "冬天，一个人在路上走。冷。钉子把手缩进袖子里。", options: ["赶紧回去", "英勇就义之感", "出来干啥", "冷就冷吧没招了"] },
            { title: "今天没什么非做不可的事", desc: "一觉睡到中午。光从窗帘缝漏进来。", options: ["不用赶时间", "起来出去走走", "再躺一会儿", "翻个身继续睡"] },
            { title: "头发和风缠到一起", desc: "龙子湖傍晚，钉子骑车从白桥上往下冲。", options: ["回去 按部就班", "绕去没走过的那条路", "去湖边坐一会儿", "骑快一点 再快一点"] },
            { title: "来过好多次，每次都不一样", desc: "杭州，绕着西湖骑车。行驶在树林里。", options: ["今天就骑到这儿吧", "去看看湖上划船的人", "停下来 在湖边坐一会儿", "一直骑 骑到骑不动"] },
            { title: "既好奇，又有点怕", desc: "雕塑园海滩上，钉子看见一种不认识的小脚印。", options: ["蹲下来研究清楚", "拍张照就走", "视而不见", "害怕地站远一点"] },
            { title: "无法名状之感", desc: "高原湖泊，缺氧高反的钉子。天压在头顶。", options: ["裹紧衣服", "往前走", "就那么站着", "差不多了"] },
            { title: "真年轻啊 年轻真好", desc: "山路上，破摩托油门拧到一百码。", options: ["安全第一", "加速试试", "路边是谁的雕塑", "向目的地进发"] },
            { title: "幸运的吧，但还是幸运的", desc: "玉龙雪山脚下等日出。同行的人说看过日照金山这辈子就值了。", options: ["这样已经很好了", "下次一个人去更远的地方", "什么都不想", "该走了 去下一站"] },
            { title: "说不上是哪首，就这一句", desc: "有人问钉子最近听什么歌。她脑子里飘进来一句歌词。", options: ["我看过沙漠下暴雨...", "我拥有的都是侥幸啊...", "你是我梦里陌生，熟悉...", "扑火，我们相视笑着"] }
        ];

        const foods = [
            { name: "轻食套餐 🥗", kcal: "250–300大卡", ingredients: "鸡胸肉+西兰花+鲜果", story: "不知道吃什么的时候就是它。成了习惯，可能这就是土象星座骨子里的秩序感。" },
            { name: "皮蛋鲜肉馄饨 🥟", kcal: "280–320大卡", ingredients: "猪肉+紫菜", story: "路口偶然发现的。是没预料到的惊喜。非常惊艳的鲜美，但是吃几个就腻了。下次再吃。" },
            { name: "水果酸奶碗 🥣", kcal: "150–200大卡", ingredients: "蓝莓/草莓+无糖酸奶", story: "甜甜的，清清爽爽。感觉很健康好久没吃了。还留着一点对轻盈日子的念想。" },
            { name: "排骨炖玉米 🌽", kcal: "400–450大卡", ingredients: "排骨+玉米", story: "看别人吃觉得应该不错，吃了也就那样。可能不会再吃吧，改发掘新食物了。" },
            { name: "咸肉菜饭 🍱", kcal: "480–530大卡", ingredients: "鸡腿+双蛋+青菜", story: "青菜少，备注也不看，奈何一个鸡腿两个卤蛋。向卤蛋屈服了，好像有点咸。" },
            { name: "泰式打抛饭 🥘", kcal: "500–560大卡", ingredients: "肉末+豆角", story: "在小吃街。国内没有当地的香料，跟普通豆角盖浇饭一样。白期待了。" },
            { name: "越南小卷粉 🥢", kcal: "260–300大卡", ingredients: "米皮+鲜肉", story: "口味很特别，酸甜咸鲜。老板刚开摊不熟练，我也是第一次吃，包容他们。美味。" },
            { name: "麻辣拌 🥗", kcal: "380–450大卡", ingredients: "杂蔬+豆制品", story: "蔬菜多，自己选，很自由。口味有点重，不怎么常吃，但选它的时候觉得今天可以稍微放纵一下。" },
            { name: "鸡腿饭 🍗", kcal: "480–530大卡", ingredients: "卤鸡腿+绿色蔬菜", story: "下课就去，素菜自选。营养丰富，最不用动脑子的选项。天天吃也不腻，啥都吃不腻。" },
            { name: "关东煮 🍢", kcal: "150–200大卡", ingredients: "萝卜+海带+虾皮", story: "不爱吃萝卜，但是专门要了萝卜。吃萝卜，咬下去第一口就通气了。玄学，没什么吃了。" },
            { name: "王由里大盘鸡 🍲", kcal: "680–750大卡", ingredients: "鸡腿肉+土豆+馕", story: "洛阳品牌。在郑州也能喝上海碧。囊好吃。虽然好吃，没有多么喜欢吃。不知为何。" },
            { name: "达美乐披萨 🍕", kcal: "单块220大卡", ingredients: "芝士+肉类+谷物饼底", story: "看起来好吃。吃了和想象不太一样。不吃总念想，吃了在懊悔，达美乐就这样反反复复。" },
            { name: "麦当劳 🍔", kcal: "600–680大卡", ingredients: "肉类主食套餐", story: "简单，方便，靠近万象城地铁口，还算好吃。泰能打打抛猪猪堡专门去吃的。其实也不怎么经常吃。" },
            { name: "酸辣土豆粉 🍜", kcal: "550–600大卡", ingredients: "土豆粉+酸豆角+辣椒", story: "很久没吃了。记得它很油，好像也没什么营养。小时候貌似喜欢吃。" },
            { name: "胖哥俩猪蹄煲 🐖", kcal: "650–750大卡", ingredients: "猪蹄+鸡蛋+鸡爪", story: "好吃，香。不常吃，偶尔在商场看见会犹豫。快饿死了。猛猛吃。" },
            { name: "临沂鲜炒鸡 🍳", kcal: "700–800大卡", ingredients: "鸡肉+土豆+宽面", story: "经常吃，吃不腻。好吃，经典。不多说。" },
            { name: "炒米粉 🍝", kcal: "450–520大卡", ingredients: "米粉+鸡蛋+青菜", story: "上完体育课顺路买回宿舍。辣，香。奖励自己炒米粉。" },
            { name: "自选凉拌菜 🥗", kcal: "180–250大卡", ingredients: "鲜蔬+豆制品+鹌鹑蛋", story: "菜多多。爱吃酸的，不要麻酱不要蒜。经常吃，不用犹豫。湖边坐着吃。" },
            { name: "福鼎肉片 🥣", kcal: "220–260大卡", ingredients: "手工猪瘦肉+紫菜+葱花", story: "以为是蛋白质，实际淀粉含量高。挺鲜美的。吃一回也没啥，好喝。" }
        ];

        const currentBgColor = computed(() => colors[step.value] || '#f3f4f6');
        
        const finalFood = computed(() => {
            const index = answers.value.reduce((a, b) => a + b, 0) % foods.length;
            return foods[index];
        });

        const nextStep = () => step.value++;
        
        const handleAnswer = (idx) => {
            answers.value.push(idx);
            nextStep();
        };

        const reset = () => {
            step.value = 0;
            answers.value = [];
        };

        const rainStyle = (n) => ({
            left: Math.random() * 100 + '%',
            animation: `rain-drop ${Math.random() * 2 + 1}s linear infinite`,
            animationDelay: Math.random() * 2 + 's'
        });

        return { step, questions, handleAnswer, finalFood, currentBgColor, nextStep, totalQuestions, rainStyle, reset };
    }
}).mount('#app');
</script>

<style>
@keyframes rain-drop {
    0% { transform: translateY(-100vh); }
    100% { transform: translateY(100vh); }
}
</style>

</body>
</html>
