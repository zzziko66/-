<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钉子今天吃什么</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --text: #1a1410;
    --accent: #c8813a;
    --soft: #e8dcc8;
    --card: #faf7f2;
    --shadow: rgba(80,50,20,0.12);
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: ‘Noto Sans SC’, sans-serif;
background: var(–bg);
color: var(–text);
min-height: 100vh;
overflow-x: hidden;
transition: background 0.8s ease, color 0.8s ease;
}

/* ===== WEATHER ANIMATIONS ===== */
#weather-layer {
position: fixed;
top: 0; left: 0;
width: 100%; height: 100%;
pointer-events: none;
z-index: 0;
overflow: hidden;
}

.rain-drop {
position: absolute;
top: -20px;
width: 1.5px;
border-radius: 1px;
animation: rain-fall linear infinite;
opacity: 0;
}

@keyframes rain-fall {
0% { transform: translateY(-20px) rotate(8deg); opacity: 0; }
10% { opacity: 0.6; }
90% { opacity: 0.4; }
100% { transform: translateY(110vh) rotate(8deg); opacity: 0; }
}

.sun-ray {
position: absolute;
top: -40px; right: -40px;
width: 280px; height: 280px;
border-radius: 50%;
background: radial-gradient(circle, rgba(255,220,120,0.35) 0%, transparent 70%);
animation: sun-pulse 4s ease-in-out infinite;
}

@keyframes sun-pulse {
0%, 100% { transform: scale(1); opacity: 0.7; }
50% { transform: scale(1.15); opacity: 1; }
}

.wind-line {
position: absolute;
height: 1px;
background: linear-gradient(90deg, transparent, rgba(150,180,220,0.4), transparent);
border-radius: 1px;
animation: wind-blow linear infinite;
opacity: 0;
}

@keyframes wind-blow {
0% { transform: translateX(-100px); opacity: 0; }
20% { opacity: 1; }
80% { opacity: 0.6; }
100% { transform: translateX(110vw); opacity: 0; }
}

.snow-flake {
position: absolute;
top: -10px;
color: rgba(200,220,255,0.7);
font-size: 14px;
animation: snow-fall linear infinite;
opacity: 0;
}

@keyframes snow-fall {
0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
10% { opacity: 0.8; }
90% { opacity: 0.5; }
100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

.star {
position: absolute;
width: 3px; height: 3px;
background: rgba(200,190,170,0.6);
border-radius: 50%;
animation: star-twinkle ease-in-out infinite;
}

@keyframes star-twinkle {
0%, 100% { opacity: 0.2; transform: scale(1); }
50% { opacity: 1; transform: scale(1.4); }
}

.cloud {
position: absolute;
background: rgba(220,215,205,0.5);
border-radius: 50px;
animation: cloud-drift linear infinite;
opacity: 0;
}

@keyframes cloud-drift {
0% { transform: translateX(-200px); opacity: 0; }
10% { opacity: 0.5; }
90% { opacity: 0.4; }
100% { transform: translateX(110vw); opacity: 0; }
}

/* ===== PAGES ===== */
.page {
display: none;
min-height: 100vh;
position: relative;
z-index: 1;
}

.page.active { display: flex; flex-direction: column; }

/* ===== HOME PAGE ===== */
#home {
justify-content: center;
align-items: center;
text-align: center;
padding: 40px 24px;
}

.home-content {
max-width: 480px;
animation: home-enter 1.2s cubic-bezier(.16,1,.3,1) both;
}

@keyframes home-enter {
from { opacity: 0; transform: translateY(30px); }
to { opacity: 1; transform: translateY(0); }
}

.home-emoji {
font-size: 80px;
display: block;
margin-bottom: 28px;
animation: emoji-bounce 3s ease-in-out infinite;
filter: drop-shadow(0 8px 20px rgba(200,130,50,0.25));
}

@keyframes emoji-bounce {
0%, 100% { transform: translateY(0) rotate(-2deg); }
50% { transform: translateY(-10px) rotate(2deg); }
}

.home-title {
font-family: ‘Noto Serif SC’, serif;
font-size: clamp(36px, 8vw, 60px);
font-weight: 900;
line-height: 1.15;
letter-spacing: -1px;
color: var(–text);
margin-bottom: 16px;
}

.home-subtitle {
font-size: 16px;
font-weight: 300;
color: rgba(80,60,40,0.65);
letter-spacing: 1.5px;
margin-bottom: 52px;
}

.home-credit {
margin-top: 28px;
font-size: 12px;
letter-spacing: 2px;
color: rgba(80,60,40,0.38);
}

.start-btn {
display: inline-block;
padding: 18px 52px;
background: var(–text);
color: var(–bg);
font-family: ‘Noto Serif SC’, serif;
font-size: 18px;
font-weight: 700;
letter-spacing: 2px;
border: none;
border-radius: 6px;
cursor: pointer;
transition: all 0.3s ease;
box-shadow: 0 6px 24px var(–shadow);
position: relative;
overflow: hidden;
}

.start-btn::after {
content: ‘’;
position: absolute;
inset: 0;
background: var(–accent);
transform: translateX(-100%);
transition: transform 0.4s cubic-bezier(.16,1,.3,1);
}

.start-btn:hover::after { transform: translateX(0); }
.start-btn span { position: relative; z-index: 1; }
.start-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 36px var(–shadow); }

.nav-row {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 10px;
}

.back-btn {
display: flex;
align-items: center;
gap: 6px;
padding: 6px 14px 6px 10px;
border: 1.5px solid rgba(0,0,0,0.1);
border-radius: 20px;
background: transparent;
font-family: ‘Noto Sans SC’, sans-serif;
font-size: 12px;
color: rgba(80,60,40,0.6);
cursor: pointer;
transition: all 0.2s ease;
letter-spacing: 0.5px;
}

.back-btn:hover {
border-color: var(–accent);
color: var(–accent);
background: rgba(200,130,58,0.06);
}

.back-btn svg {
width: 12px; height: 12px;
stroke: currentColor;
fill: none;
stroke-width: 2;
stroke-linecap: round;
stroke-linejoin: round;
flex-shrink: 0;
}

.back-btn.hidden { visibility: hidden; pointer-events: none; }

#quiz {
padding: 0;
flex-direction: column;
}

.quiz-header {
padding: 24px 28px 20px;
border-bottom: 1px solid rgba(0,0,0,0.06);
background: rgba(255,255,255,0.4);
backdrop-filter: blur(8px);
position: sticky;
top: 0;
z-index: 10;
}

.progress-track {
height: 3px;
background: rgba(0,0,0,0.08);
border-radius: 2px;
overflow: hidden;
}

.progress-fill {
height: 100%;
background: var(–accent);
border-radius: 2px;
transition: width 0.6s cubic-bezier(.16,1,.3,1);
}

.q-num {
font-family: ‘Noto Serif SC’, serif;
font-weight: 700;
font-size: 13px;
color: var(–accent);
}

.quiz-body {
flex: 1;
padding: 36px 28px 40px;
display: flex;
flex-direction: column;
max-width: 580px;
margin: 0 auto;
width: 100%;
}

.q-scene {
font-size: 12px;
font-weight: 500;
letter-spacing: 2px;
color: rgba(120,90,50,0.5);
text-transform: uppercase;
margin-bottom: 6px;
opacity: 0;
animation: fade-up 0.5s 0.1s ease both;
}

.q-title {
font-family: ‘Noto Serif SC’, serif;
font-size: clamp(18px, 4vw, 24px);
font-weight: 700;
line-height: 1.35;
margin-bottom: 12px;
opacity: 0;
animation: fade-up 0.5s 0.2s ease both;
}

.q-desc {
font-size: 16px;
font-weight: 400;
line-height: 1.9;
color: rgba(60,45,30,0.78);
margin-bottom: 36px;
opacity: 0;
animation: fade-up 0.5s 0.3s ease both;
padding-bottom: 20px;
border-bottom: 1px solid rgba(0,0,0,0.06);
}

@keyframes fade-up {
from { opacity: 0; transform: translateY(14px); }
to { opacity: 1; transform: translateY(0); }
}

.options {
display: flex;
flex-direction: column;
gap: 12px;
}

.opt-btn {
display: flex;
align-items: flex-start;
gap: 14px;
padding: 16px 20px;
background: rgba(255,255,255,0.6);
border: 1.5px solid rgba(0,0,0,0.07);
border-radius: 10px;
cursor: pointer;
text-align: left;
font-family: inherit;
transition: all 0.25s ease;
opacity: 0;
animation: fade-up 0.5s ease both;
box-shadow: 0 2px 8px rgba(0,0,0,0.04);
width: 100%;
}

.opt-btn:nth-child(1) { animation-delay: 0.35s; }
.opt-btn:nth-child(2) { animation-delay: 0.42s; }
.opt-btn:nth-child(3) { animation-delay: 0.49s; }
.opt-btn:nth-child(4) { animation-delay: 0.56s; }

.opt-letter {
flex-shrink: 0;
width: 26px; height: 26px;
border-radius: 50%;
background: var(–soft);
display: flex; align-items: center; justify-content: center;
font-size: 11px;
font-weight: 700;
color: var(–accent);
transition: all 0.25s ease;
margin-top: 1px;
}

.opt-text {
font-size: 14px;
line-height: 1.6;
color: var(–text);
font-weight: 400;
padding-top: 2px;
flex: 1;
}

.opt-btn:hover {
border-color: var(–accent);
background: rgba(255,255,255,0.9);
transform: translateX(4px);
box-shadow: 0 4px 16px rgba(200,130,58,0.12);
}

.opt-btn:hover .opt-letter {
background: var(–accent);
color: white;
}

.opt-btn.selected {
border-color: var(–accent);
background: rgba(200,130,58,0.08);
transform: translateX(4px);
}

.opt-btn.selected .opt-letter {
background: var(–accent);
color: white;
}

/* ===== RESULT PAGE ===== */
#result {
display: none;
flex-direction: column;
min-height: 100vh;
align-items: center;
justify-content: center;
padding: 48px 24px 60px;
text-align: center;
position: relative;
overflow: hidden;
}

#result.active { display: flex; }

.result-firework {
position: absolute;
pointer-events: none;
font-size: 24px;
animation: firework-burst 1.5s ease-out both;
opacity: 0;
}

@keyframes firework-burst {
0% { transform: scale(0) translateY(0); opacity: 1; }
60% { opacity: 1; }
100% { transform: scale(2.5) translateY(-60px); opacity: 0; }
}

.result-badge {
font-size: 90px;
display: block;
margin-bottom: 20px;
animation: result-pop 0.8s cubic-bezier(.175,.885,.32,1.275) 0.3s both;
filter: drop-shadow(0 12px 30px rgba(200,130,50,0.3));
}

@keyframes result-pop {
from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
to { opacity: 1; transform: scale(1) rotate(0deg); }
}

.result-label {
font-size: 11px;
letter-spacing: 3px;
color: var(–accent);
font-weight: 600;
text-transform: uppercase;
margin-bottom: 12px;
animation: fade-up 0.6s 0.6s ease both;
opacity: 0;
}

.result-food-name {
font-family: ‘Noto Serif SC’, serif;
font-size: clamp(30px, 7vw, 48px);
font-weight: 900;
letter-spacing: -0.5px;
margin-bottom: 8px;
animation: fade-up 0.6s 0.7s ease both;
opacity: 0;
}

.result-cal {
font-size: 14px;
font-weight: 500;
color: rgba(80,60,40,0.65);
letter-spacing: 1.5px;
margin-bottom: 28px;
animation: fade-up 0.6s 0.8s ease both;
opacity: 0;
background: var(–soft);
padding: 5px 16px;
border-radius: 20px;
display: inline-block;
}

.result-ingredients {
display: flex;
gap: 8px;
flex-wrap: wrap;
justify-content: center;
margin-bottom: 28px;
animation: fade-up 0.6s 0.85s ease both;
opacity: 0;
}

.ingredient-tag {
padding: 6px 14px;
background: rgba(200,130,58,0.12);
border: 1px solid rgba(200,130,58,0.35);
border-radius: 20px;
font-size: 13px;
font-weight: 500;
color: var(–accent);
letter-spacing: 0.3px;
}

.result-story {
max-width: 420px;
background: rgba(255,255,255,0.55);
border: 1px solid rgba(200,180,150,0.3);
border-radius: 14px;
padding: 22px 24px;
font-size: 14px;
line-height: 1.9;
color: rgba(60,45,30,0.75);
font-weight: 300;
margin-bottom: 36px;
animation: fade-up 0.6s 0.95s ease both;
opacity: 0;
text-align: left;
position: relative;
}

.result-story::before {
content: ‘”’;
position: absolute;
top: -10px; left: 16px;
font-family: ‘Noto Serif SC’, serif;
font-size: 60px;
color: var(–accent);
opacity: 0.25;
line-height: 1;
}

.restart-btn {
padding: 14px 40px;
border: 2px solid var(–text);
border-radius: 6px;
background: transparent;
font-family: ‘Noto Serif SC’, serif;
font-size: 15px;
font-weight: 700;
letter-spacing: 2px;
cursor: pointer;
transition: all 0.3s ease;
color: var(–text);
animation: fade-up 0.6s 1.1s ease both;
opacity: 0;
}

.restart-btn:hover {
background: var(–text);
color: var(–bg);
transform: translateY(-2px);
}

.confetti-piece {
position: fixed;
width: 8px; height: 8px;
border-radius: 2px;
animation: confetti-fall linear both;
pointer-events: none;
z-index: 100;
}

@keyframes confetti-fall {
0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ===== TRANSITIONS ===== */
.page-transition {
animation: page-in 0.5s cubic-bezier(.16,1,.3,1) both;
}

@keyframes page-in {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}

/* Reset browser default button styles (fixes blue text on GitHub Pages) */
button {
-webkit-appearance: none;
appearance: none;
color: inherit;
font-family: inherit;
}

/* theme colors per question */
.theme-warm  { –bg:#f5ede0; –accent:#c8813a; –soft:#ecdfc9; –text:#1a1410; }
.theme-cold  { –bg:#e8eef5; –accent:#5a7fa8; –soft:#d0dce9; –text:#1a1410; }
.theme-dusk  { –bg:#f0e8f2; –accent:#9a6ab0; –soft:#e0d0e8; –text:#1a1410; }
.theme-green { –bg:#e8f2e8; –accent:#5a9a6a; –soft:#d0e8d0; –text:#1a1410; }
.theme-sand  { –bg:#f2ede0; –accent:#b07040; –soft:#e0d4b8; –text:#1a1410; }
</style>

</head>
<body>

<div id="weather-layer"></div>

<!-- HOME PAGE -->

<div class="page active" id="home">
  <div class="home-content">
    <span class="home-emoji">🍴</span>
    <h1 class="home-title">钉子今天吃什么</h1>
    <p class="home-subtitle">这是一个值得深思的问题</p>
    <button class="start-btn" onclick="startQuiz()"><span>开始探索 →</span></button>
    <p class="home-credit">创作者：钉子</p>
  </div>
</div>

<!-- QUIZ PAGE -->

<div class="page" id="quiz">
  <div class="quiz-header">
    <div class="nav-row">
      <button class="back-btn hidden" id="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        上一题
      </button>
      <span class="q-num" id="q-num-label">01 / 10</span>
      <span id="q-progress-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
  <div class="quiz-body" id="quiz-body">
    <!-- dynamic content -->
  </div>
</div>

<!-- RESULT PAGE -->

<div class="page" id="result">
  <div class="result-badge" id="result-emoji">🥗</div>
  <div class="result-label">今天就决定是你了</div>
  <div class="result-food-name" id="result-name">轻食套餐</div>
  <div class="result-cal" id="result-cal">250–300大卡</div>
  <div class="result-ingredients" id="result-ingredients"></div>
  <div class="result-story" id="result-story"></div>
  <button class="restart-btn" onclick="restart()">再来一次</button>
</div>

<script>
const questions = [
  {
    title: "这绝对是个逛公园的好天气",
    desc: "昨晚大暴雨，现在凉快了。钉子站在阳台。",

  },
  {

    desc: "冬天，一个人在路上走。冷。钉子把手缩进袖子里。",

    weather: "cold-wind",
    theme: "cold"
  },
  {
    title: "今天没什么非做不可的事",
    desc: "一觉睡到中午。光从窗帘缝漏进来。",
    options: ["不用赶时间", "起来出去走走", "再躺一会儿", "翻个身继续睡"],
    weather: "lazy-sun",
    theme: "sand"
  },
  {
    title: "头发和风缠到一起",
    desc: "龙子湖傍晚，钉子骑车从白桥上往下冲。她捏了刹车，完成一个帅气又安全的右转弯。",
    options: ["回去 按部就班", "绕去没走过的那条路", "去湖边坐一会儿", "骑快一点 再快一点"],
    weather: "windy",
    theme: "green"
  },
  {
    title: "来过好多次，每次都不一样",
    desc: "杭州，绕着西湖骑车。行驶在树林里。",
    options: ["今天就骑到这儿吧", "去看看湖上划船的人", "停下来 在湖边坐一会儿", "一直骑 骑到骑不动"],
    weather: "dappled",
    theme: "green"
  },
  {
    title: "既好奇，又有点怕",
    desc: "雕塑园海滩上，钉子看见一种不认识的小脚印，密密麻麻沿着海岸。",
    options: ["蹲下来研究清楚", "拍张照就走", "视而不见", "害怕地站远一点"],
    weather: "beach",
    theme: "sand"
  },
  {
    title: "无法名状之感",
    desc: "高原湖泊，缺氧高反的钉子。天压在头顶。",
    options: ["裹紧衣服", "往前走", "就那么站着", "差不多了"],
    weather: "highland",
    theme: "dusk"
  },
  {
    title: "真年轻啊 年轻真好",
    desc: "山路上，破摩托油门拧到一百码。风灌进袖子，眼泪从眼眶滑出来。",
    options: ["安全第一", "加速试试", "路边是谁的雕塑", "向目的地进发"],
    weather: "windy",
    theme: "warm"
  },
  {
    title: "幸运的吧，但还是幸运的",
    desc: "玉龙雪山脚下等日出。同行的人说看过日照金山这辈子就值了。钉子想，足够了。",
    options: ["这样已经很好了", "下次一个人去更远的地方", "什么都不想", "该走了 去下一站"],
    weather: "snow",
    theme: "cold"
  },
  {
    title: "说不上是哪首，就这一句",
    desc: "有人问钉子最近听什么歌。她脑子里飘进来一句歌词，一直在绕。",
    options: [
      "我看过沙漠下暴雨，看过大海亲吻鲨鱼",
      "我拥有的都是侥幸啊，我失去的都是人生",
      "你是我梦里陌生，熟悉，与众不同",
      "扑火，我们相视笑着"
    ],
    weather: "night",
    theme: "dusk"
  }
];

const foods = [
  { emoji:"🥗", name:"轻食套餐", cal:"250–300大卡", ing:["鸡胸肉","西兰花","鲜果"], story:"不知道吃什么的时候就是它。成了习惯，可能这就是土象星座骨子里的秩序感。" },
  { emoji:"🥟", name:"皮蛋鲜肉馄饨", cal:"280–320大卡", ing:["猪肉","紫菜"], story:"路口偶然发现的。是没预料到的惊喜。非常惊艳的鲜美，但是吃几个就腻了。下次再吃。" },

let current = 0;
let answers = [];
const letters = ['A','B','C','D'];

const weatherLayer = document.getElementById('weather-layer');

function clearWeather() {
  weatherLayer.innerHTML = '';
}

function makeWeather(type) {
  clearWeather();
  if (type === 'sunny-after-rain') {
    // Sun + a few lingering drops
    const sun = document.createElement('div');
    sun.className = 'sun-ray';
    weatherLayer.appendChild(sun);
    for(let i=0;i<15;i++) spawnRain(true);
  } else if (type === 'cold-wind') {
    for(let i=0;i<8;i++) spawnWind();
    for(let i=0;i<5;i++) setTimeout(()=>spawnWind(), i*800);
  } else if (type === 'lazy-sun') {
    const sun = document.createElement('div');
    sun.className = 'sun-ray';
    sun.style.opacity = '0.5';
    weatherLayer.appendChild(sun);
  } else if (type === 'windy') {
    for(let i=0;i<12;i++) spawnWind();
  } else if (type === 'dappled') {
    const sun = document.createElement('div');
    sun.className = 'sun-ray';
    sun.style.width = '200px'; sun.style.height = '200px';
    weatherLayer.appendChild(sun);
    for(let i=0;i<3;i++) spawnCloud();
  } else if (type === 'beach') {
    const sun = document.createElement('div');
    sun.className = 'sun-ray';
    sun.style.background = 'radial-gradient(circle, rgba(255,200,80,0.4) 0%, transparent 70%)';
    weatherLayer.appendChild(sun);
    for(let i=0;i<4;i++) spawnCloud();
  } else if (type === 'highland') {
    for(let i=0;i<5;i++) spawnCloud();
    const sun = document.createElement('div');
    sun.className = 'sun-ray';
    sun.style.opacity = '0.3';
    weatherLayer.appendChild(sun);
  } else if (type === 'snow') {
    for(let i=0;i<20;i++) spawnSnow();
  } else if (type === 'night') {
    for(let i=0;i<30;i++) spawnStar();
  }
}

function spawnRain(sparse) {
  const el = document.createElement('div');
  el.className = 'rain-drop';
  const h = 15 + Math.random()*20;
  el.style.cssText = `left:${Math.random()*100}%;height:${h}px;background:linear-gradient(to bottom,transparent,rgba(150,180,220,0.5));animation-duration:${0.6+Math.random()*0.4}s;animation-delay:${Math.random()*2}s;opacity:0;`;
  weatherLayer.appendChild(el);
}

function spawnWind() {
  const el = document.createElement('div');
  el.className = 'wind-line';
  el.style.cssText = `top:${Math.random()*80+10}%;width:${80+Math.random()*120}px;animation-duration:${1.5+Math.random()}s;animation-delay:${Math.random()*3}s;`;
  weatherLayer.appendChild(el);
}

function spawnSnow() {
  const el = document.createElement('div');
  el.className = 'snow-flake';
  el.textContent = ['❄','*','·'][Math.floor(Math.random()*3)];
  el.style.cssText = `left:${Math.random()*100}%;animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*4}s;font-size:${10+Math.random()*8}px;`;
  weatherLayer.appendChild(el);
}

function spawnStar() {
  const el = document.createElement('div');
  el.className = 'star';
  el.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*60}%;animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*3}s;`;
  weatherLayer.appendChild(el);
}

function spawnCloud() {
  const el = document.createElement('div');
  el.className = 'cloud';
  const w = 80+Math.random()*80;
  el.style.cssText = `top:${Math.random()*30+5}%;width:${w}px;height:${w*0.35}px;animation-duration:${12+Math.random()*8}s;animation-delay:${Math.random()*5}s;`;
  weatherLayer.appendChild(el);
}

const themeMap = {
  warm:  { bg:'#f5ede0', accent:'#c8813a', soft:'#ecdfc9', text:'#1a1410' },
  cold:  { bg:'#e8eef5', accent:'#5a7fa8', soft:'#d0dce9', text:'#1a1410' },
  dusk:  { bg:'#f0e8f2', accent:'#9a6ab0', soft:'#e0d0e8', text:'#1a1410' },
  green: { bg:'#e8f2e8', accent:'#5a9a6a', soft:'#d0e8d0', text:'#1a1410' },
  sand:  { bg:'#f2ede0', accent:'#b07040', soft:'#e0d4b8', text:'#1a1410' }
};

function setTheme(theme) {
  document.body.className = `theme-${theme}`;
  const t = themeMap[theme] || themeMap.warm;
  const root = document.documentElement;
  root.style.setProperty('--bg', t.bg);
  root.style.setProperty('--accent', t.accent);
  root.style.setProperty('--soft', t.soft);
  root.style.setProperty('--text', t.text);
  document.body.style.background = t.bg;
  document.body.style.color = t.text;
}

function startQuiz() {
  document.getElementById('home').classList.remove('active');
  document.getElementById('quiz').classList.add('active','page-transition');
  makeWeather(questions[0].weather);
  setTheme(questions[0].theme);
  renderQuestion(0);
}

function renderQuestion(idx) {
  const q = questions[idx];
  const body = document.getElementById('quiz-body');
  const pct = Math.round((idx/questions.length)*100);
  document.getElementById('q-num-label').textContent = String(idx+1).padStart(2,'0') + ' / 10';
  document.getElementById('q-progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  // show/hide back button
  const backBtn = document.getElementById('back-btn');
  if (idx === 0) {
    backBtn.classList.add('hidden');
  } else {
    backBtn.classList.remove('hidden');
  }

  body.innerHTML = `
    <div class="q-scene">Scene ${String(idx+1).padStart(2,'0')}</div>
    <div class="q-title">${q.title}</div>
    <div class="q-desc">${q.desc}</div>
    <div class="options">
      ${q.options.map((o,i)=>`
        <button class="opt-btn${answers[idx]===i?' selected':''}" onclick="selectAnswer(${idx},${i})">
          <span class="opt-letter">${letters[i]}</span>
          <span class="opt-text">${o}</span>
        </button>
      `).join('')}
    </div>
  `;
}

function goBack() {
  if (current <= 0) return;
  const prev = current - 1;
  current = prev;
  makeWeather(questions[prev].weather);
  setTheme(questions[prev].theme);
  renderQuestion(prev);
}

function selectAnswer(qIdx, optIdx) {
  answers[qIdx] = optIdx;
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b=>b.classList.remove('selected'));
  btns[optIdx].classList.add('selected');

  setTimeout(()=>{
    if(qIdx < questions.length - 1) {
      const next = qIdx + 1;
      current = next;
      makeWeather(questions[next].weather);
      setTheme(questions[next].theme);
      renderQuestion(next);
    } else {
      showResult();
    }
  }, 420);
}

function showResult() {
  document.getElementById('quiz').classList.remove('active');
  const resultEl = document.getElementById('result');
  resultEl.classList.add('active');

  // pick food based on answer sum
  const sum = answers.reduce((a,b)=>a+b,0);
  const food = foods[sum % foods.length];

  document.getElementById('result-emoji').textContent = food.emoji;
  document.getElementById('result-name').textContent = food.name;
  document.getElementById('result-cal').textContent = food.cal;
  document.getElementById('result-story').textContent = food.story;

  const ingEl = document.getElementById('result-ingredients');
  ingEl.innerHTML = food.ing.map(i=>`<span class="ingredient-tag">${i}</span>`).join('');

  // confetti!
  spawnConfetti();

  // fireworks
  const fwEmojis = ['✨','🎉','⭐','🌟','💫','🎊'];
  for(let i=0;i<6;i++) {
    setTimeout(()=>{
      const fw = document.createElement('div');
      fw.className = 'result-firework';
      fw.textContent = fwEmojis[i%fwEmojis.length];
      fw.style.cssText = `left:${10+Math.random()*80}%;top:${5+Math.random()*40}%;animation-delay:${i*0.15}s;`;
      resultEl.appendChild(fw);
      setTimeout(()=>fw.remove(), 2000);
    }, i*200);
  }
}

function spawnConfetti() {
  const colors = ['#c8813a','#5a9a6a','#9a6ab0','#5a7fa8','#e8c860','#e86060'];
  for(let i=0;i<40;i++) {
    setTimeout(()=>{
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `left:${Math.random()*100}%;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*6}px;height:${6+Math.random()*6}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.5}s;`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 4000);
    }, i*60);
  }
}

function restart() {
  current = 0;
  answers = [];
  document.getElementById('result').classList.remove('active');
  document.querySelectorAll('.result-firework').forEach(e=>e.remove());
  clearWeather();
  setTheme('warm');
  document.getElementById('home').classList.add('active','page-transition');
}
</script>
